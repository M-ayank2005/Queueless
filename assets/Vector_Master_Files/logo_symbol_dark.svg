<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Squircle Gradients & Shadow -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B18" />
    </radialGradient>

    <linearGradient id="squircle-border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.35" />
    </linearGradient>

    <!-- Logo Gradients -->
    <linearGradient id="dark-q-grad" x1="60" y1="60" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="dark-arrow-grad" x1="220" y1="360" x2="450" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <filter id="icon-ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base (iOS/Android Continuous Curved Surface) -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg-glow)" />
  <rect x="16" y="16" width="480" height="480" rx="110" stroke="url(#squircle-border)" stroke-width="2" />

  <!-- Glass Inner Highlight -->
  <path d="M 126 18 C 66 18 18 66 18 126 L 18 200 C 120 180 392 180 494 200 L 494 126 C 494 66 446 18 386 18 Z" fill="white" opacity="0.04" />

  <!-- Core Logo Embedded Inside Squircle -->
  <g transform="translate(16, 16) scale(0.94)">
    <!-- Radar / Queue Target Rings -->
    <g opacity="0.4" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 8">
      <circle cx="235" cy="245" r="95" />
      <circle cx="235" cy="245" r="65" />
    </g>

    <!-- Crosshairs -->
    <g opacity="0.35" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round">
      <line x1="235" y1="130" x2="235" y2="170" />
      <line x1="235" y1="320" x2="235" y2="360" />
      <line x1="120" y1="245" x2="160" y2="245" />
      <line x1="310" y1="245" x2="350" y2="245" />
    </g>

    <!-- Central Real-Time Pulse Beacon -->
    <circle cx="235" cy="245" r="22" fill="#0284C7" opacity="0.3" filter="url(#icon-ambient-glow)" />
    <circle cx="235" cy="245" r="14" fill="#38BDF8" filter="url(#icon-ambient-glow)" />
    <circle cx="235" cy="245" r="7" fill="#FFFFFF" />

    <!-- Stream Speed Flares -->
    <path d="M 330 190 C 375 195 405 170 425 140 C 410 175 375 220 320 230 Z" fill="#38BDF8" opacity="0.75" />
    <path d="M 360 250 C 405 240 435 210 445 180 C 435 220 395 265 345 280 Z" fill="#60A5FA" opacity="0.85" />

    <!-- Q Major Ring -->
    <path d="
      M 235 70
      C 138 70 60 148 60 245
      C 60 342 138 420 235 420
      C 285 420 330 399 362 365
      C 335 345 305 320 285 300
      C 270 315 253 325 235 325
      C 191 325 155 289 155 245
      C 155 201 191 165 235 165
      C 279 165 315 201 315 245
      C 315 260 310 274 302 286
      C 324 300 355 325 385 345
      C 401 316 410 282 410 245
      C 410 148 332 70 235 70 Z"
      fill="url(#dark-q-grad)"
      filter="url(#icon-ambient-glow)"
    />

    <!-- Surge Arrow -->
    <path d="
      M 245 325
      C 290 325 330 345 365 375
      C 395 345 425 295 455 220
      L 460 255
      L 475 190
      L 410 205
      L 435 220
      C 405 280 375 320 345 340
      C 315 315 275 290 245 290
      Z"
      fill="url(#dark-arrow-grad)"
    />
  </g>
</svg>
